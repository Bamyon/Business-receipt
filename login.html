<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — MyPayment by Bamyon</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { primary: '#0F6B4C', primarydark: '#084C36', accent: '#F5A623' },
    fontFamily: { display: ['DM Sans','sans-serif'], sans: ['Inter','sans-serif'] }
  } } }
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[var(--bg)] min-h-screen flex flex-col">

<div class="p-5">
  <a href="/" class="inline-flex items-center gap-2.5">
    <img src="/public/images/bamyon-mark.png" alt="" class="w-8 h-8 rounded-lg">
    <span class="font-display font-bold text-lg">MyPayment</span>
  </a>
</div>

<div class="flex-1 flex items-center justify-center px-5 pb-16">
  <div class="w-full max-w-sm">
    <h1 class="font-display text-2xl font-bold text-slate-900 mb-1">Welcome back</h1>
    <p class="text-sm text-[var(--muted)] mb-6">Log in to manage your payments and orders.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input required type="email" name="email" autocomplete="email">
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input required type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-primary text-white font-semibold hover:bg-primarydark transition">Log in</button>
    </form>

    <p class="text-sm text-[var(--muted)] mt-6 text-center">
      New to MyPayment? <a href="/signup.html" class="text-primary font-semibold">Create an account</a>
    </p>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script type="module" src="/js/login-page.js"></script>
</body>
</html>
