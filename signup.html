<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — MyPayment by Bamyon</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { primary: '#0F6B4C', primarydark: '#084C36', accent: '#F5A623' },
    fontFamily: { display: ['DM Sans','sans-serif'], sans: ['Inter','sans-serif'] }
  } } }
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[var(--bg)] min-h-screen flex flex-col">

<div class="p-5">
  <a href="/" class="inline-flex items-center gap-2.5">
    <img src="/public/images/bamyon-mark.png" alt="" class="w-8 h-8 rounded-lg">
    <span class="font-display font-bold text-lg">MyPayment</span>
  </a>
</div>

<div class="flex-1 flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-md">
    <h1 class="font-display text-2xl font-bold text-slate-900 mb-1">Set up your business</h1>
    <p class="text-sm text-[var(--muted)] mb-6">Takes about a minute — then create your first payment link.</p>

    <form id="signup-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-medium block mb-1">Full name</label>
          <input required name="fullName" autocomplete="name">
        </div>
        <div>
          <label class="text-sm font-medium block mb-1">Business name</label>
          <input required name="businessName">
        </div>
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input required type="email" name="email" autocomplete="email">
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input required type="password" name="password" minlength="6" autocomplete="new-password">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-medium block mb-1">WhatsApp number</label>
          <input required name="whatsapp" placeholder="080...">
        </div>
        <div>
          <label class="text-sm font-medium block mb-1">Category</label>
          <select name="category">
            <option>Food & Drinks</option>
            <option>Fashion</option>
            <option>Electronics</option>
            <option>Services</option>
            <option>Events</option>
            <option>Education</option>
            <option>Digital Products</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-primary text-white font-semibold hover:bg-primarydark transition">Create account</button>
    </form>

    <p class="text-sm text-[var(--muted)] mt-6 text-center">
      Already have an account? <a href="/login.html" class="text-primary font-semibold">Log in</a>
    </p>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script type="module" src="/js/signup-page.js"></script>
</body>
</html>
